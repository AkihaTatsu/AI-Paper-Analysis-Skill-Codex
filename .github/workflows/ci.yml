name: Compatibility

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - run: uv python install ${{ matrix.python }}
      - run: uv sync --extra dev --frozen --python ${{ matrix.python }}
      - run: uv run --python ${{ matrix.python }} pytest -m "not live"

  platform-baseline:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --extra dev --frozen --python 3.12
      - run: uv run --python 3.12 pytest -m "not live"

  report-rendering:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: "22.12"
          cache: npm
      - run: uv python install 3.12
      - run: uv sync --extra dev --frozen --python 3.12
      - run: npm ci --ignore-scripts
      - name: Verify both Markdown mathematics paths
        run: uv run --extra dev --frozen --python 3.12 pytest tests/test_report_prepare.py -k both_real_markdown_math_paths
      - run: npm run test:mermaid-syntax
      - run: npm run test:mermaid-layout
      - run: node tests/test_report_renderer.mjs
      - name: Install, increment, and render outside the checkout
        env:
          APA_RUN_INSTALL_TESTS: "1"
        run: uv run --extra dev --frozen --python 3.12 pytest tests/test_installer.py -m installation
