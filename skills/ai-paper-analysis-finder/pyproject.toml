[project]
name = "ai-paper-analysis-finder"
version = "0.1.0"
description = "Shared-cache runtime for the ai-paper-analysis-finder Codex Skill"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.28,<1",
  "jsonschema>=4.23,<5",
  "markdown-it-py>=3.0,<5",
  "mkdocs>=1.6,<2",
  "mkdocs-material>=9.6,<10",
  "pymupdf>=1.25,<2",
  "pypdf>=5.1,<7",
  "pymdown-extensions>=11.0.1",
  "pyyaml>=6.0,<7",
  "typer>=0.15,<1",
]

[project.optional-dependencies]
ocr = ["ocrmypdf>=16.7,<18"]

[tool.uv]
package = false
